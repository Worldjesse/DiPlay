name: Build legacy-head-unit APKs

# Builds the APKs for the old-head-unit target: Android 8.0+ on ARM, and Intel x86_64 for
# the GWM Lemon seats (Harman / iFlytek HiLife). Split from android.yml so the matrix stays
# readable and so a single ABI failing does not hide the others.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default set. Covers BYD DiLink and every ARM head unit.
          - name: arm (arm64-v8a, armeabi-v7a)
            abi: arm64-v8a,armeabi-v7a
            apk: mobile/build/outputs/apk/debug/mobile-arm64-v8a.apk
          # GWM Lemon (VV6/VV7 era) and other Intel x86_64 head units.
          - name: intel-x86_64
            abi: x86_64
            apk: mobile/build/outputs/apk/debug/mobile-x86_64.apk
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      # The ABI list is passed as a property rather than by editing shared/build.gradle, so the
      # same source produces either flavor and the choice is visible in the run log.
      - name: Show build inputs
        run: |
          echo "abiFilters: ${{ matrix.abi }}"
          echo "minSdk: 26 (Android 8.0)"
          java -version

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :mobile:lintDebug --stacktrace

      - name: Build debug APK for ${{ matrix.abi }}
        run: ./gradlew :mobile:assembleDebug -PdiplyAbiFilters=${{ matrix.abi }} --stacktrace

      - name: Rename APK to identify its ABI
        run: |
          set -euo pipefail
          src=$(ls mobile/build/outputs/apk/debug/*.apk | head -1)
          echo "built: $src"
          cp "$src" "${{ matrix.apk }}"
          # Prove the ABI actually landed in the APK rather than trusting the Gradle property.
          unzip -l "${{ matrix.apk }}" | grep 'lib/' || true
          unzip -l "${{ matrix.apk }}" | grep 'lib/' | grep -o 'lib/[a-z0-9_-]*/' | sort -u

      - name: Verify the APK really targets this ABI and API level
        run: |
          set -euo pipefail
          apk="${{ matrix.apk }}"

          # The whole point of the matrix: this APK must contain the requested ABI and nothing
          # else. A universal APK would still install on an x86_64 head unit but would be twice
          # the size and would hide a broken filter, so assert instead of printing.
          #
          # The expected list is built with a pipeline on its own line. Writing
          # `expected="a,b" | tr ...` would send the assignment into the pipeline's stdin and
          # leave `expected` unset, which trips `set -u`.
          abis=$(unzip -l "$apk" | grep -o 'lib/[a-z0-9_-]*/' | sort -u | sed 's#lib/##; s#/$##')
          expected=$(printf '%s' '${{ matrix.abi }}' | tr ',' '\n' | sort -u)
          echo "packaged ABIs: $abis"
          echo "expected ABIs: $expected"
          if [ "$abis" != "$expected" ]; then
            echo "::error::expected ABIs [$expected] but packaged [$abis]"
            exit 1
          fi

          # minSdk has to be 26 or the APK is useless on the head units this targets.
          # aapt2 badging omits sdkVersion whenever it matches the compile-time default, so the
          # manifest is read instead. The uses-sdk element is printed on failure, which is what
          # showed the real format in the first place: aapt2 writes the value in decimal here
          # (minSdkVersion(0x0101020c)=26) even though the attribute id is hex.
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "targetSdkVersion|native-code"
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")

          # Isolate the attribute, drop its own resource id, then normalise decimal or hex to
          # decimal. Verified locally against =26, =0x1a, =(type 0x10)0x1a, ="26" and ="0x1a".
          raw=$(printf '%s\n' "$manifest" \
            | tr -d '\r' \
            | grep -oE 'minSdkVersion\([^)]*\)[[:space:]]*=[^\n]*' \
            | head -1 \
            | sed 's/.*=[[:space:]]*//' \
            | tr -d '"' \
            | sed 's/^(type 0x[0-9a-fA-F]*)//' \
            | grep -oE '(0x[0-9a-fA-F]+|[0-9]+)$' || true)
          minsdk=$(
            value=$(printf '%s' "$raw" | grep -oE '(0x[0-9a-fA-F]+|[0-9]+)' | head -1 || true)
            case "$value" in
              0x*|0X*) printf '%d' "$value" ;;
              *) printf '%s' "$value" ;;
            esac
          )
          echo "minSdkVersion: ${minsdk:-not found}"
          if [ "$minsdk" != "26" ]; then
            echo "::error::expected minSdkVersion 26 but found ${minsdk:-not found}"
            echo "uses-sdk element follows:"
            printf '%s\n' "$manifest" | grep -A4 'uses-sdk' | head -12
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-${{ matrix.name }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.name }}
          path: mobile/build/reports/lint-results-debug.html
          retention-days: 7
